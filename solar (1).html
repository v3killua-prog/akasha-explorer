<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Akasha Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Exo 2',sans-serif}
  #canvas-container{position:fixed;inset:0;z-index:0}
  canvas{display:block;width:100%!important;height:100%!important}

  /* Header */
  #header{position:fixed;top:0;left:0;z-index:100;padding:22px 32px;display:flex;align-items:center;gap:14px}
  #header a{font-family:'Orbitron',monospace;font-weight:900;font-size:1.35rem;letter-spacing:.18em;text-decoration:none;color:#fff;text-shadow:0 0 24px #f97316,0 0 48px #fb923c55;transition:text-shadow .3s}
  #header a:hover{text-shadow:0 0 30px #fb923c,0 0 70px #f9731666}
  .dot{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fde68a,#f97316);box-shadow:0 0 12px #f97316,0 0 24px #fb923c;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}

  /* Planet labels */
  .planet-label{position:fixed;pointer-events:none;z-index:50;font-family:'Orbitron',monospace;font-size:.62rem;letter-spacing:.2em;color:rgba(255,255,255,.75);text-shadow:0 0 10px currentColor;transform:translate(-50%,-50%);transition:opacity .4s;white-space:nowrap}

  /* Moon label */
  #moon-label{position:fixed;z-index:200;pointer-events:auto;display:none;font-family:'Orbitron',monospace;font-weight:700;font-size:1rem;letter-spacing:.3em;color:#e2e8f0;text-shadow:0 0 20px #94a3b8,0 0 40px #cbd5e1;cursor:pointer;transform:translate(-50%,-50%);transition:opacity .5s,text-shadow .3s;padding:10px 20px;border:1px solid rgba(148,163,184,.25);background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border-radius:4px}
  #moon-label:hover{text-shadow:0 0 30px #e2e8f0,0 0 60px #94a3b8;border-color:rgba(148,163,184,.6)}
  #moon-label::before{content:'';position:absolute;inset:0;border-radius:4px;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent);pointer-events:none}

  /* HUD */
  #hud{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:28px;align-items:center;opacity:.5;transition:opacity .3s;font-size:.7rem;letter-spacing:.12em;color:#94a3b8}
  #hud:hover{opacity:.9}
  .hud-item{display:flex;align-items:center;gap:7px}
  .hud-icon{width:18px;height:18px;opacity:.7}

  /* Tooltip */
  #tooltip{position:fixed;pointer-events:none;z-index:300;font-family:'Exo 2',sans-serif;font-size:.78rem;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 14px;opacity:0;transition:opacity .2s;transform:translate(-50%,-130%);white-space:nowrap}

  /* Stars overlay shimmer */
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 20% 50%,rgba(15,23,42,.3) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(30,10,60,.2) 0%,transparent 50%)}
</style>
</head>
<body>

<div id="canvas-container"><canvas id="c"></canvas></div>
<div id="overlay"></div>

<div id="header">
  <div class="dot"></div>
  <a href="index.html">Akasha Explorer</a>
  <nav class="page-nav" style="display:flex;gap:20px;margin-left:40px;">
    <a href="index.html" style="font-size:0.9rem;letter-spacing:.1em;">Home</a>
    <a href="solar.html" style="font-size:0.9rem;letter-spacing:.1em;">Solar System</a>
    <a href="satellites.html" style="font-size:0.9rem;letter-spacing:.1em;">Satellites</a>
    <a href="moon.html" style="font-size:0.9rem;letter-spacing:.1em;">Moon</a>
  </nav>
</div>

<div id="moon-label" onclick="location.href='moon.html'">THE MOON</div>
<div id="tooltip"></div>

<div id="hud">
  <div class="hud-item">
    <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    DRAG TO ROTATE
  </div>
  <div style="width:1px;height:16px;background:rgba(255,255,255,.2)"></div>
  <div class="hud-item">
    <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
    SCROLL TO ZOOM
  </div>
  <div style="width:1px;height:16px;background:rgba(255,255,255,.2)"></div>
  <div class="hud-item">
    <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    ZOOM NEAR EARTH
  </div>
</div>

<script>
// ── Utility ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 10000);
camera.position.set(0, 60, 160);
camera.lookAt(0,0,0);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ── Procedural Textures ───────────────────────────────────────────────────────
function makeCanvas(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); fn(ctx,w,h); return c;
}
function canvasTex(w,h,fn){return new THREE.CanvasTexture(makeCanvas(w,h,fn));}

// Noise helper (simplex-like via sin)
function noise2(x,y){
  return (Math.sin(x*127.1+y*311.7)*43758.5453)%1;
}
function fbm(x,y,oct=5){
  let v=0,a=.5,f=1;
  for(let i=0;i<oct;i++){v+=a*(Math.sin(x*f*3.7+y*f*2.3+1.3)*0.5+0.5+Math.sin(x*f*1.9-y*f*4.1+2.7)*0.5+0.5)*0.5;a*=0.5;f*=2.1;}
  return v;
}

// SUN texture
const sunTex = canvasTex(1024,512,(ctx,w,h)=>{
  const grd=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  grd.addColorStop(0,'#fff7e0'); grd.addColorStop(.3,'#fde68a');
  grd.addColorStop(.6,'#fb923c'); grd.addColorStop(1,'#b45309');
  ctx.fillStyle=grd; ctx.fillRect(0,0,w,h);
  for(let i=0;i<2000;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const n=fbm(x/w*4,y/h*4,6);
    ctx.fillStyle=`rgba(255,${120+n*135|0},${n*60|0},${n*0.6})`;
    ctx.fillRect(x,y,Math.random()*6+1,Math.random()*3+1);
  }
  // sunspots
  for(let i=0;i<8;i++){
    const x=80+Math.random()*(w-160), y=80+Math.random()*(h-160);
    const r=Math.random()*18+6;
    const sg=ctx.createRadialGradient(x,y,0,x,y,r);
    sg.addColorStop(0,'rgba(60,20,0,.9)'); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
});
const sunEmit = canvasTex(512,256,(ctx,w,h)=>{
  const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  g.addColorStop(0,'#fffbf0'); g.addColorStop(.5,'#fbbf24'); g.addColorStop(1,'#78350f');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
});

// Generic rocky planet
function rockTex(base,accent,w=512,h=256){
  return canvasTex(w,h,(ctx)=>{
    ctx.fillStyle=base; ctx.fillRect(0,0,w,h);
    for(let i=0;i<3000;i++){
      const x=Math.random()*w, y=Math.random()*h;
      const n=fbm(x/w*6,y/h*6);
      ctx.fillStyle=`rgba(${accent},${n*.7})`;
      ctx.fillRect(x,y,Math.random()*4+1,Math.random()*4+1);
    }
    for(let i=0;i<20;i++){
      const x=Math.random()*w, y=Math.random()*h, r=Math.random()*8+2;
      const cg=ctx.createRadialGradient(x,y,0,x,y,r);
      cg.addColorStop(0,'rgba(0,0,0,.5)'); cg.addColorStop(1,'transparent');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  });
}
// Earth
const earthTex = canvasTex(1024,512,(ctx,w,h)=>{
  // Ocean base
  ctx.fillStyle='#1e4080'; ctx.fillRect(0,0,w,h);
  // Continents
  const continents=[
    {x:.15,y:.35,rx:.12,ry:.2,c:'#2d6a1f'},{x:.28,y:.38,rx:.06,ry:.12,c:'#3a7a25'},
    {x:.55,y:.3,rx:.14,ry:.22,c:'#4a8a2f'},{x:.7,y:.42,rx:.08,ry:.16,c:'#3d7a22'},
    {x:.38,y:.55,rx:.05,ry:.08,c:'#4a8a2f'},{x:.48,y:.6,rx:.04,ry:.06,c:'#3a7a25'},
    {x:.62,y:.62,rx:.09,ry:.1,c:'#2a6a1a'},{x:.2,y:.65,rx:.07,ry:.09,c:'#3a7a22'},
    {x:.85,y:.35,rx:.06,ry:.12,c:'#2d6a1f'},
  ];
  continents.forEach(({x,y,rx,ry,c})=>{
    ctx.fillStyle=c; ctx.beginPath();
    ctx.ellipse(x*w,y*h,rx*w,ry*h,Math.random()*Math.PI,0,Math.PI*2); ctx.fill();
    // coastline noise
    for(let i=0;i<60;i++){
      const bx=x*w+(Math.random()-.5)*rx*w*2.5;
      const by=y*h+(Math.random()-.5)*ry*h*2.5;
      const br=Math.random()*rx*w*.5+5;
      ctx.fillStyle=Math.random()>.5?c:'#1e4080';
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    }
  });
  // polar ice
  ctx.fillStyle='rgba(220,240,255,.85)';
  ctx.fillRect(0,0,w,22); ctx.fillRect(0,h-18,w,18);
  // Clouds
  for(let i=0;i<40;i++){
    const cx=Math.random()*w, cy=20+Math.random()*(h-40);
    const cr=Math.random()*40+10;
    const cg2=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
    cg2.addColorStop(0,'rgba(255,255,255,.6)'); cg2.addColorStop(1,'transparent');
    ctx.fillStyle=cg2; ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  }
});
// Moon
const moonTex = canvasTex(512,256,(ctx,w,h)=>{
  ctx.fillStyle='#8a8a8a'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const n=fbm(x/w*8,y/h*8);
    ctx.fillStyle=`rgba(${60+n*100|0},${60+n*100|0},${60+n*100|0},.6)`;
    ctx.fillRect(x,y,Math.random()*3+1,Math.random()*3+1);
  }
  for(let i=0;i<30;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*12+3;
    const cg=ctx.createRadialGradient(x-.3*r,y-.3*r,0,x,y,r);
    cg.addColorStop(0,'rgba(180,180,180,.3)');
    cg.addColorStop(.7,'rgba(80,80,80,.5)');
    cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
});
// Jupiter bands
const jupiterTex = canvasTex(1024,512,(ctx,w,h)=>{
  const bands=['#c2956b','#e8c88a','#b87040','#f0d9a0','#c8854a','#ead5a0','#b07035','#dcc090','#c07848','#f5e0b0'];
  let y=0; const bh=h/bands.length;
  bands.forEach((c,i)=>{ctx.fillStyle=c; ctx.fillRect(0,i*bh,w,bh+1);});
  // Great Red Spot
  const gx=.35*w, gy=.55*h;
  const gg=ctx.createRadialGradient(gx,gy,0,gx,gy,28);
  gg.addColorStop(0,'#c0392b'); gg.addColorStop(.5,'#a93226'); gg.addColorStop(1,'transparent');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(gx,gy,28,18,0,0,Math.PI*2); ctx.fill();
  // noise
  for(let i=0;i<2000;i++){
    const x=Math.random()*w, y=Math.random()*h;
    ctx.fillStyle=`rgba(0,0,0,${Math.random()*.1})`; ctx.fillRect(x,y,2,1);
  }
});
// Saturn
const saturnTex = canvasTex(512,256,(ctx,w,h)=>{
  const bands2=['#d4a96a','#e8c87a','#c89555','#f0d890','#d4a060','#e8c070'];
  bands2.forEach((c,i)=>{ctx.fillStyle=c; ctx.fillRect(0,i*(h/bands2.length),w,h/bands2.length+1);});
  for(let i=0;i<800;i++){
    const x=Math.random()*w, y=Math.random()*h;
    ctx.fillStyle=`rgba(180,140,80,${Math.random()*.15})`; ctx.fillRect(x,y,3,1);
  }
});
// Saturn rings texture
const ringTex = canvasTex(512,64,(ctx,w,h)=>{
  for(let x=0;x<w;x++){
    const t=x/w;
    const alpha=(Math.sin(t*Math.PI*12)*0.3+0.5)*(1-Math.abs(t-.5)*1.8);
    const l=200+t*40|0;
    ctx.fillStyle=`rgba(${l},${l-30},${l-60},${Math.max(0,alpha)})`;
    ctx.fillRect(x,0,1,h);
  }
});
const marsT  = rockTex('#8b3a1a','180,80,40');
const mercT  = rockTex('#7a7060','160,150,130');
const venusT = canvasTex(512,256,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#e8c060'); g.addColorStop(.5,'#d4a040'); g.addColorStop(1,'#c09030');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  for(let i=0;i<1200;i++){
    const x=Math.random()*w, y=Math.random()*h, n=fbm(x/w*5,y/h*5);
    ctx.fillStyle=`rgba(255,200,80,${n*.3})`; ctx.fillRect(x,y,Math.random()*5+1,Math.random()*2+1);
  }
});
const uranusT = canvasTex(512,256,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#5ac8c0'); g.addColorStop(1,'#4ab0b8'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  for(let i=0;i<200;i++){
    const x=Math.random()*w, y=Math.random()*h;
    ctx.fillStyle=`rgba(100,220,220,${Math.random()*.15})`; ctx.fillRect(x,y,Math.random()*20+5,Math.random()*2+1);
  }
});
const neptuneT = canvasTex(512,256,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#1a3a9a'); g.addColorStop(1,'#0a2070'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  for(let i=0;i<300;i++){
    const x=Math.random()*w, y=Math.random()*h;
    ctx.fillStyle=`rgba(60,100,220,${Math.random()*.2})`; ctx.fillRect(x,y,Math.random()*15+3,Math.random()*2+1);
  }
});

// ── Stars ─────────────────────────────────────────────────────────────────────
(()=>{
  const geo=new THREE.BufferGeometry();
  const N=12000, pos=new Float32Array(N*3), col=new Float32Array(N*3), sz=new Float32Array(N);
  const colors=['#ffffff','#ffe8c0','#c0d8ff','#ffd0d0','#d0ffd8'];
  for(let i=0;i<N;i++){
    const r=800+Math.random()*1200;
    const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
    pos[i*3+2]=r*Math.cos(phi);
    const c=new THREE.Color(colors[Math.floor(Math.random()*colors.length)]);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i]=Math.random()<.02?3:Math.random()<.1?2:1;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.PointsMaterial({size:.8,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:false});
  scene.add(new THREE.Points(geo,mat));
})();

// ── Lighting ─────────────────────────────────────────────────────────────────
const sunLight=new THREE.PointLight('#fff5e0',3.5,2000,1.2);
scene.add(sunLight);
const ambLight=new THREE.AmbientLight('#0a0a20',.18);
scene.add(ambLight);

// ── Sun ───────────────────────────────────────────────────────────────────────
const sunGeo=new THREE.SphereGeometry(14,64,64);
const sunMat=new THREE.MeshStandardMaterial({map:sunTex,emissiveMap:sunEmit,emissive:new THREE.Color('#fbbf24'),emissiveIntensity:1.8,roughness:1,metalness:0});
const sun=new THREE.Mesh(sunGeo,sunMat); sun.castShadow=false; scene.add(sun);

// Sun glow (additive)
const glowGeo=new THREE.SphereGeometry(16,32,32);
const glowMat=new THREE.MeshBasicMaterial({color:'#f97316',transparent:true,opacity:.08,side:THREE.BackSide});
scene.add(new THREE.Mesh(glowGeo,glowMat));
const glowGeo2=new THREE.SphereGeometry(20,32,32);
const glowMat2=new THREE.MeshBasicMaterial({color:'#fbbf24',transparent:true,opacity:.04,side:THREE.BackSide});
scene.add(new THREE.Mesh(glowGeo2,glowMat2));

// ── Orbit ring helper ─────────────────────────────────────────────────────────
function makeOrbit(a,b){
  const pts=[];
  for(let i=0;i<=200;i++){
    const t=i/200*Math.PI*2;
    pts.push(new THREE.Vector3(a*Math.cos(t),0,b*Math.sin(t)));
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color:0x334455,transparent:true,opacity:.35});
  return new THREE.Line(geo,mat);
}

// ── Planets ───────────────────────────────────────────────────────────────────
const planetDefs=[
  {name:'Mercury', tex:mercT,  r:1.8,  a:26,  b:24,  speed:.047, tilt:.034, color:'#aaa090'},
  {name:'Venus',   tex:venusT, r:3.2,  a:42,  b:40,  speed:.035, tilt:177,  color:'#d4a040'},
  {name:'Earth',   tex:earthTex,r:3.5, a:60,  b:57,  speed:.029, tilt:23.4, color:'#4a8f4f', isEarth:true},
  {name:'Mars',    tex:marsT,  r:2.5,  a:82,  b:78,  speed:.024, tilt:25.2, color:'#b05030'},
  {name:'Jupiter', tex:jupiterTex,r:9, a:120, b:115, speed:.013, tilt:3.1,  color:'#c8a060'},
  {name:'Saturn',  tex:saturnT,r:7.5,  a:162, b:155, speed:.009, tilt:26.7, color:'#d4a060', hasSatRing:true},
  {name:'Uranus',  tex:uranusT,r:5.5,  a:198, b:190, speed:.006, tilt:97.8, color:'#5ac8c0'},
  {name:'Neptune', tex:neptuneT,r:5.2, a:232, b:222, speed:.005, tilt:28.3, color:'#2050c0'},
];

const planets=[]; let earthPlanet=null;

planetDefs.forEach(def=>{
  const geo=new THREE.SphereGeometry(def.r,48,48);
  const mat=new THREE.MeshStandardMaterial({map:def.tex,roughness:.85,metalness:.05});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.receiveShadow=true; mesh.castShadow=true;
  mesh.rotation.z=THREE.MathUtils.degToRad(def.tilt);

  // Pivot for orbit
  const pivot=new THREE.Object3D();
  pivot.add(mesh);
  scene.add(pivot);
  scene.add(makeOrbit(def.a,def.b));

  // Saturn ring
  if(def.hasSatRing){
    const rGeo=new THREE.RingGeometry(def.r*1.35,def.r*2.3,80);
    // UV fix
    const pos2=rGeo.attributes.position, uv=rGeo.attributes.uv;
    for(let i=0;i<pos2.count;i++){
      const v=new THREE.Vector3().fromBufferAttribute(pos2,i);
      const r2=(v.length()-def.r*1.35)/(def.r*2.3-def.r*1.35);
      uv.setXY(i,r2,0);
    }
    const rMat=new THREE.MeshBasicMaterial({map:ringTex,side:THREE.DoubleSide,transparent:true,opacity:.85});
    const ring=new THREE.Mesh(rGeo,rMat);
    ring.rotation.x=Math.PI/2.1;
    mesh.add(ring);
  }

  const p={mesh,pivot,def,angle:Math.random()*Math.PI*2};
  planets.push(p);
  if(def.isEarth){earthPlanet=p; earthPlanet.earthMesh=mesh;}
});

// ── Moon ─────────────────────────────────────────────────────────────────────
const moonGeo=new THREE.SphereGeometry(1,32,32);
const moonMat=new THREE.MeshStandardMaterial({map:moonTex,roughness:.9,metalness:.0});
const moonMesh=new THREE.Mesh(moonGeo,moonMat);
let moonAngle=0;

// Moon orbit visible ring (shown only when zoomed)
const moonOrbitLine=makeOrbit(9,9);
moonOrbitLine.visible=false;
scene.add(moonOrbitLine);

// ── Camera Controls ───────────────────────────────────────────────────────────
let isDragging=false, lastMouse={x:0,y:0};
let camTheta=Math.PI/8, camPhi=Math.PI/3.2;
let camRadius=160;
let targetRadius=160, targetTheta=camTheta, targetPhi=camPhi;
const minR=20, maxR=280;

canvas.addEventListener('mousedown',e=>{isDragging=true;lastMouse={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',()=>isDragging=false);
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-lastMouse.x, dy=e.clientY-lastMouse.y;
  targetTheta-=dx*.005; targetPhi=Math.max(.15,Math.min(Math.PI-.15,targetPhi+dy*.005));
  lastMouse={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('wheel',e=>{
  targetRadius=Math.max(minR,Math.min(maxR,targetRadius+e.deltaY*.18));
  e.preventDefault();
},{passive:false});

// Touch
let lastTouch=null,lastPinch=null;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};}
  else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastPinch=Math.sqrt(dx*dx+dy*dy);
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&isDragging&&lastTouch){
    const dx=e.touches[0].clientX-lastTouch.x, dy=e.touches[0].clientY-lastTouch.y;
    targetTheta-=dx*.005; targetPhi=Math.max(.15,Math.min(Math.PI-.15,targetPhi+dy*.005));
    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
  } else if(e.touches.length===2&&lastPinch){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    targetRadius=Math.max(minR,Math.min(maxR,targetRadius-(dist-lastPinch)*.4));
    lastPinch=dist;
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{isDragging=false;lastTouch=null;lastPinch=null;});

// ── Tooltip / hover ───────────────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const tooltip=document.getElementById('tooltip');
window.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  tooltip.style.left=e.clientX+'px';
  tooltip.style.top=e.clientY+'px';
});

// ── Moon label ────────────────────────────────────────────────────────────────
const moonLabel=document.getElementById('moon-label');
let earthZoomed=false;
let moonLabelPos=new THREE.Vector3();

// ── Animate ───────────────────────────────────────────────────────────────────
let t=0;
const clock=new THREE.Clock();
const camTarget=new THREE.Vector3();
let smoothCamTarget=new THREE.Vector3();

function toScreen(v3){
  const v=v3.clone().project(camera);
  return {x:(v.x*.5+.5)*innerWidth, y:(1-(v.y*.5+.5))*innerHeight, z:v.z};
}

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  t+=dt;

  // Rotate sun
  sun.rotation.y=t*.03;

  // Orbit planets
  planets.forEach(p=>{
    p.angle+=p.def.speed*dt;
    const x=p.def.a*Math.cos(p.angle);
    const z=p.def.b*Math.sin(p.angle);
    p.mesh.position.set(x,0,z);
    p.mesh.rotation.y+=dt*.3;
  });

  // Earth world pos
  const earthWorldPos=new THREE.Vector3();
  earthPlanet.mesh.getWorldPosition(earthWorldPos);

  // Moon orbit around Earth
  moonAngle+=dt*.6;
  const mOff=new THREE.Vector3(9*Math.cos(moonAngle),1.2*Math.sin(moonAngle*.7),9*Math.sin(moonAngle));
  moonMesh.position.copy(earthWorldPos).add(mOff);
  moonMesh.rotation.y+=dt*.2;

  // Camera smooth follow
  camTheta+=(targetTheta-camTheta)*.08;
  camPhi  +=(targetPhi  -camPhi  )*.08;
  camRadius+=(targetRadius-camRadius)*.08;

  // Check if zoomed near Earth
  const distToEarth=targetRadius;
  // Earth orbital radius ~60, so we consider "zoomed" when cam is within ~45 units
  const earthDist=camera.position.distanceTo(earthWorldPos);
  const zoomThresh=30;
  earthZoomed=earthDist<zoomThresh;

  // Camera focus: when zoomed to Earth, drift target toward Earth
  if(earthZoomed){
    camTarget.lerp(earthWorldPos,.06);
  } else {
    camTarget.lerp(new THREE.Vector3(0,0,0),.06);
  }

  // Place camera spherically
  const sx=camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  const sy=camRadius*Math.cos(camPhi);
  const sz=camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  camera.position.set(sx+camTarget.x,sy+camTarget.y,sz+camTarget.z);
  camera.lookAt(camTarget);

  // Moon visibility & orbit line
  const moonInScene=moonMesh.parent===scene;
  if(earthZoomed && !moonInScene){scene.add(moonMesh); moonOrbitLine.visible=true;}
  if(!earthZoomed && moonInScene){scene.remove(moonMesh); moonOrbitLine.visible=false;}

  // Update moon orbit ring position
  if(earthZoomed){
    moonOrbitLine.position.copy(earthWorldPos);
  }

  // Moon label
  if(earthZoomed){
    const ms=toScreen(moonMesh.position);
    if(ms.z<1){
      moonLabel.style.display='block';
      moonLabel.style.left=ms.x+'px';
      moonLabel.style.top=(ms.y-28)+'px';
      moonLabel.style.opacity=Math.min(1,(zoomThresh-earthDist)/12);
    }
  } else {
    moonLabel.style.display='none';
  }

  // Tooltip
  raycaster.setFromCamera(mouse,camera);
  const meshes=planets.map(p=>p.mesh);
  const hits=raycaster.intersectObjects(meshes);
  if(hits.length){
    const pd=planets.find(p=>p.mesh===hits[0].object);
    if(pd){tooltip.style.opacity='1'; tooltip.textContent=pd.def.name;}
  } else {
    tooltip.style.opacity='0';
  }

  // Planet label overlay (screen-space)
  document.querySelectorAll('.planet-label').forEach(el=>el.remove());
  if(camRadius>60){
    planets.forEach(p=>{
      const wp=new THREE.Vector3(); p.mesh.getWorldPosition(wp);
      const s=toScreen(wp);
      if(s.z<1&&s.z>0&&s.x>0&&s.x<innerWidth&&s.y>0&&s.y<innerHeight){
        const el=document.createElement('div'); el.className='planet-label';
        el.textContent=p.def.name.toUpperCase();
        el.style.left=s.x+'px'; el.style.top=(s.y+p.def.r*15/camRadius*100+18)+'px';
        el.style.color=p.def.color||'#fff';
        document.body.appendChild(el);
      }
    });
  }

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
